# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Deploy docker image

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

# Isolate stacked PR builds and replace stale runs only for that PR.
# Production/manual builds on the same ref finish before the next run starts.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all-image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all-image == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: .github/ci-filters.yml

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all-image == 'true'
    strategy:
      matrix:
        # The regular image is already built and tested by E2E on PRs.
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["all"]' || '["", "all"]') }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}${{ matrix.variant == 'all' && '-all' || '' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ matrix.variant == 'all' && 'VARIANT=all' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Keep variants separate and include intermediate dependency/build stages.
          cache-from: type=gha,version=2,scope=deploy-${{ matrix.variant || 'regular' }}
          cache-to: type=gha,version=2,mode=max,scope=deploy-${{ matrix.variant || 'regular' }}

name: Publish Helm chart
on:
  workflow_call:
    inputs:
      release-tag:
        description: Stable Celery Insights tag that has published its application images
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Prepare matching chart version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          uv sync --locked
          version=$(uv run python -m tooling.helm.release "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned validation tools
        run: bash tooling/helm/install-tools.sh
      - name: Install application configuration validator
        run: bun install --frozen-lockfile
      - name: Validate the chart and released application image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm repo add surrealdb https://helm.surrealdb.com
          helm dependency build charts/celery-insights
          helm lint --strict charts/celery-insights
          uv run python tooling/helm/chart_test.py
          uv run python -m unittest tooling.helm.release_test
          bash tooling/helm/validate-manifests.sh
          app_version="$RELEASE_VERSION"
          docker pull "ghcr.io/danyi1212/celery-insights:$app_version"
          HELM_CONFIG_VALIDATOR_IMAGE="ghcr.io/danyi1212/celery-insights:$app_version" uv run python tooling/helm/chart_test.py

      - name: Package and publish OCI chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          mkdir -p chart-dist
          helm package charts/celery-insights --destination chart-dist
          helm push chart-dist/*.tgz oci://ghcr.io/danyi1212/charts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: helm-chart
          path: chart-dist/*.tgz

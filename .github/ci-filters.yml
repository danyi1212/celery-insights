# Keep workflow changes in their own filters so the affected jobs validate them.
backend:
  - '**/*.py'
  - 'pyproject.toml'
  - 'uv.lock'
  - '.python-version'
  - '.pre-commit-config.yaml'
  - '.github/workflows/ci.yml'
  - '.github/ci-filters.yml'

frontend:
  - 'src/**'
  - 'runtime/**'
  - 'e2e/**'
  - 'tooling/**/*.ts'
  - 'public/**'
  - 'package.json'
  - 'bun.lock*'
  - 'bun-entry.ts'
  - 'index.html'
  - 'tsconfig.json'
  - 'vite.config.ts'
  - 'vitest.config.ts'
  - 'vitest.setup.ts'
  - '.oxlintrc.json'
  - '.oxfmtrc.json'
  - '.pre-commit-config.yaml'
  - '.github/workflows/ci.yml'
  - '.github/ci-filters.yml'

# E2E also runs for frontend/backend changes, as combined in the CI workflow.
integration:
  - 'Dockerfile'
  - '.dockerignore'
  - 'docker-bake.hcl'
  - 'test_project/**'
  - '.github/workflows/deploy.yml'
  - '.github/workflows/ci.yml'
  - '.github/ci-filters.yml'

database:
  - 'runtime/**'
  - 'tooling/verify-surreal-*'
  - 'server/surrealdb_client*'
  - 'server/server_info/backup*'
  - 'package.json'
  - 'bun.lock*'
  - 'tsconfig.json'
  - 'pyproject.toml'
  - 'uv.lock'
  - '.python-version'
  - 'Dockerfile'
  - '.github/workflows/ci.yml'
  - '.github/ci-filters.yml'

# E2E already builds the regular image. Only Python/container changes need
# another PR build to validate the optional Python dependencies in VARIANT=all.
all-image:
  - 'server/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - '.python-version'
  - 'Dockerfile'
  - '.dockerignore'
  - '.github/workflows/deploy.yml'
  - '.github/ci-filters.yml'

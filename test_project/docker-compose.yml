services:
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-celery.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 3s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 5s
      retries: 15
  worker:
    image: celery-insights-test-project:local
    build: .
    command: celery -A celery_app worker -l INFO -c 4 -n worker@%h
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq/
      RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-secondary:
    image: celery-insights-test-project:local
    build: .
    command: celery -A celery_app worker -l INFO -c 2 -Q secondary -n worker-secondary@%h
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq/
      RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    image: celery-insights-test-project:local
    build: .
    command: python -m producer.interval
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq/
      RESULT_BACKEND: redis://redis:6379/0
      PRODUCE_INTERVAL: "8"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  interactive:
    image: celery-insights-test-project:local
    build: .
    command: uvicorn producer.interactive:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      BROKER_URL: amqp://guest:guest@rabbitmq/
      RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - interactive

  reverse-proxy:
    profiles:
      - reverse-proxy
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${E2E_PROXY_PORT:-8558}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      URL_PREFIX: ${URL_PREFIX:-/tools/celery}
      NGINX_ENVSUBST_FILTER: URL_PREFIX
    depends_on:
      - celery-insights

  celery-insights:
    image: celery-insights-app:local
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${E2E_APP_PORT:-8555}:8555"
    environment:
      URL_PREFIX: ${URL_PREFIX:-}
      BROKER_URL: amqp://guest:guest@rabbitmq/
      RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

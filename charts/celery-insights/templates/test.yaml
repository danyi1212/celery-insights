apiVersion: v1
kind: Pod
metadata:
  name: {{ include "insights.fullname" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.test.image | quote }}
      command: [sh, -c]
      args:
        - >-
          for attempt in 1 2 3 4 5 6; do
            wget -T 5 --spider "http://{{ include "insights.fullname" . }}:{{ .Values.service.port }}/ready" && exit 0;
            sleep 2;
          done;
          exit 1
